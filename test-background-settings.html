<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Settings Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: #090d16;
            color: white;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #334155;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #3b82f6;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #2563eb;
        }
        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 10px 0;
        }
        .color-btn {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            border: 2px solid #475569;
            cursor: pointer;
        }
        .color-btn.selected {
            border-color: #84cc16;
        }
    </style>
</head>
<body>
    <h1>Background Settings Test</h1>
    
    <div class="test-section">
        <h2>Test localStorage Functionality</h2>
        <button onclick="testSaveSettings()">Save Test Settings</button>
        <button onclick="testLoadSettings()">Load Test Settings</button>
        <button onclick="testClearSettings()">Clear Settings</button>
        <div id="test-result"></div>
    </div>
    
    <div class="test-section">
        <h2>Test Background Application</h2>
        <button onclick="applyColor('#1e293b')">Apply Dark Blue</button>
        <button onclick="applyColor('#84cc16')">Apply Lime Green</button>
        <button onclick="applyColor('#ef4444')">Apply Red</button>
        <button onclick="resetBackground()">Reset Background</button>
    </div>
    
    <div class="test-section">
        <h2>Color Picker Test</h2>
        <div class="color-grid">
            <div class="color-btn" style="background-color: #090d16;" onclick="applyColor('#090d16')"></div>
            <div class="color-btn" style="background-color: #0f172a;" onclick="applyColor('#0f172a')"></div>
            <div class="color-btn" style="background-color: #1e293b;" onclick="applyColor('#1e293b')"></div>
            <div class="color-btn" style="background-color: #334155;" onclick="applyColor('#334155')"></div>
            <div class="color-btn" style="background-color: #84cc16;" onclick="applyColor('#84cc16')"></div>
            <div class="color-btn" style="background-color: #3b82f6;" onclick="applyColor('#3b82f6')"></div>
            <div class="color-btn" style="background-color: #ef4444;" onclick="applyColor('#ef4444')"></div>
            <div class="color-btn" style="background-color: #f59e0b;" onclick="applyColor('#f59e0b')"></div>
        </div>
    </div>

    <script>
        function testSaveSettings() {
            const testSettings = {
                type: 'color',
                color: '#84cc16',
                imageFile: null,
                imagePreview: ''
            };
            localStorage.setItem('backgroundSettings', JSON.stringify(testSettings));
            document.getElementById('test-result').innerHTML = 'Settings saved successfully!';
        }
        
        function testLoadSettings() {
            const saved = localStorage.getItem('backgroundSettings');
            if (saved) {
                const settings = JSON.parse(saved);
                document.getElementById('test-result').innerHTML = 'Loaded: ' + JSON.stringify(settings);
                applyColor(settings.color);
            } else {
                document.getElementById('test-result').innerHTML = 'No settings found';
            }
        }
        
        function testClearSettings() {
            localStorage.removeItem('backgroundSettings');
            document.getElementById('test-result').innerHTML = 'Settings cleared!';
            resetBackground();
        }
        
        function applyColor(color) {
            document.body.style.backgroundColor = color;
        }
        
        function resetBackground() {
            document.body.style.backgroundColor = '#090d16';
        }
    </script>
</body>
</html>
