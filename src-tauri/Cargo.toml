[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = "2"
tauri-plugin-os = "2.2.0"
# Save/open pickers for profile export and import (PROFILE_SYNC_SPEC.md §7, §10).
# Resolves to 2.7.x and pulls rfd. BOTH entry points must register it - a plugin
# registered only in main.rs is silently missing on mobile, which fails with
# "dialog.save not allowed. Plugin not found".
tauri-plugin-dialog = "2"
